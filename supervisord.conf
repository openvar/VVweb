##############################################################################
# SUPERVISOR MAIN CONFIG
##############################################################################

[supervisord]
logfile=/local/VVweb/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/local/VVweb/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[unix_http_server]
file=/local/VVweb/supervisord.sock
chmod=0777

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///local/VVweb/supervisord.sock


##############################################################################
# CELERY WORKER
##############################################################################

[program:celery_worker]
command=/bin/bash -lc "source /local/miniconda3/etc/profile.d/conda.sh && conda activate vvweb_v2 && exec celery -A VVweb worker -l error --concurrency=2 --max-tasks-per-child=50 --prefetch-multiplier=1 --pidfile=/local/VVweb/celery_worker.pid"
directory=/local/VVweb
user=wwwrun
autostart=true
autorestart=true
stopwaitsecs=20
stdout_logfile=/local/VVweb/logs/celery_worker_out.log
stderr_logfile=/local/VVweb/logs/celery_worker_err.log
redirect_stderr=true


##############################################################################
# CELERY BEAT
##############################################################################

[program:celery_beat]
command=/bin/bash -lc "source /local/miniconda3/etc/profile.d/conda.sh && conda activate vvweb_v2 && exec celery -A VVweb beat -l error --scheduler django_celery_beat.schedulers.DatabaseScheduler --pidfile=/local/VVweb/celery_beat.pid"
directory=/local/VVweb
user=wwwrun
autostart=true
autorestart=true
stopwaitsecs=20
stdout_logfile=/local/VVweb/logs/celery_beat_out.log
stderr_logfile=/local/VVweb/logs/celery_beat_err.log
redirect_stderr=true

